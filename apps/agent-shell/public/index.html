<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>TravelsTrem Partner Portal</title>

    <!-- Primary meta -->
    <meta
      name="description"
      content="TravelsTrem Partner Portal helps travel agencies, trip leaders, vendors, guides, and other partners manage product operations."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />

    <!-- Shared TravelsTrem favicon -->
    <link
      rel="icon"
      type="image/png"
      href="%PUBLIC_URL%/favicon.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      href="%PUBLIC_URL%/favicon-dark.png"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Canonical -->
    <link rel="canonical" href="https://travelstrem-testfe.onrender.com/" />

    <!-- Open Graph (for link previews on social) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TravelsTrem Partner Portal" />
    <meta
      property="og:description"
      content="Manage partner operations across the TravelsTrem product ecosystem."
    />
    <meta property="og:url" content="https://travelstrem-testfe.onrender.com/" />
    <meta property="og:site_name" content="TravelsTREM" />
    <!-- replace with your real image (1200x630 recommended) -->
    <meta property="og:image" content="https://travelstrem-testfe.onrender.com/og-image.jpg" />
    <meta property="og:image:alt" content="TravelsTrem Partner Portal" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TravelsTrem Partner Portal" />
    <meta
      name="twitter:description"
      content="Discover curated tours, book experiences, and explore destinations with TravelsTREM."
    />
    <meta name="twitter:image" content="https://travelstrem-testfe.onrender.com/og-image.jpg" />
    <!-- optional: your twitter handle -->
    <meta name="twitter:site" content="@YourTwitterHandle" />

    <!-- Preconnect / Preload (fonts, analytics) -->
    <!-- example for Google Fonts , replace if you self-host fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "TravelsTREM",
        "url": "https://travelstrem-testfe.onrender.com/",
        "sameAs": [],
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://travelstrem-testfe.onrender.com/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
