<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>TravelsTrem</title>

    <!-- Primary meta -->
    <meta
      name="description"
      content="TravelsTrem, the platform powering Trevio and Trevista."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />

    <!-- Favicon / PWA -->
    <link rel="icon" type="image/png" href="/logo-images/favicon-32.png" />
    <link
      rel="icon"
      type="image/png"
      href="/logo-images/favicon-32.png"
      sizes="16x16"
    />
    <link
      rel="icon"
      type="image/png"
      href="/logo-images/favicon-32.png"
      sizes="32x32"
    />
    <link
      rel="icon"
      type="image/png"
      href="/logo-images/favicon-32.png"
      sizes="48x48"
    />
    <link
      rel="icon"
      type="image/png"
      href="/logo-images/favicon-32.png"
      sizes="80x80"
    />

    <link rel="apple-touch-icon" href="/logo-images/favicon-32.png" />
    <link rel="manifest" href="/logo-images/manifest.json" />

    <!-- Canonical -->
    <link rel="canonical" href="https://travelstrem-testfe.onrender.com/" />

    <!-- Open Graph (for link previews on social) -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="TravelsTrem"
    />
    <meta
      property="og:description"
      content="TravelsTrem platform powering Trevio and Trevista."
    />
    <meta
      property="og:url"
      content="https://travelstrem-testfe.onrender.com/"
    />
    <meta property="og:site_name" content="TravelsTrem" />
    <!-- replace with your real image (1200x630 recommended) -->
    <meta
      property="og:image"
      content="https://travelstrem-testfe.onrender.com/og-image.jpg"
    />
    <meta
      property="og:image:alt"
      content="TravelsTrem"
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="TravelsTrem"
    />
    <meta
      name="twitter:description"
      content="TravelsTrem platform powering Trevio and Trevista."
    />
    <meta
      name="twitter:image"
      content="https://travelstrem-testfe.onrender.com/og-image.jpg"
    />
    <!-- optional: your twitter handle -->
    <meta name="twitter:site" content="@YourTwitterHandle" />

    <!-- Preconnect / Preload (fonts, analytics) -->
    <!-- example for Google Fonts , replace if you self-host fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Consider preloading hero image or OG image for speed -->
    <link rel="preload" href="/og-image.jpg" as="image" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "TravelsTrem",
        "url": "https://travelstrem-testfe.onrender.com/",
        "sameAs": [],
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://travelstrem-testfe.onrender.com/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

      This HTML file is a template.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
