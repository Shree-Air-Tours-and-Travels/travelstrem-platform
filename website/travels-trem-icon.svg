  <path fill="#061b40" d="M145 69 181 84l39-35c8-7 16-8 21-3 5 5 3 13-4 21l-39 42 12 48c3 11 0 19-7 22-7 2-13-3-17-13l-18-40-34 23 2 24c1 8-2 14-8 16l-12-11-3-31-22-13c-8-5-10-11-7-17 3-6 10-7 18-3l23 10 29-27-33-16c-9-4-12-10-9-16 3-6 10-8 18-4l32 15Z"/>

