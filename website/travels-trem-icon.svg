<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title">
  <title id="title">TravelsTREM globe and airplane icon</title>
  <defs>
    <linearGradient id="globeGradient" x1="48" y1="30" x2="174" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16c4b1"/>
      <stop offset=".52" stop-color="#0aa9bd"/>
      <stop offset="1" stop-color="#165bd2"/>
    </linearGradient>
    <linearGradient id="orbitGradient" x1="34" y1="192" x2="188" y2="116" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08a9ba"/>
      <stop offset=".52" stop-color="#126bd1"/>
      <stop offset="1" stop-color="#2855d8"/>
    </linearGradient>
  </defs>

