<header class="topbar">
  <div class="container nav-wrap">
    <a class="brand" href="{{navigation.home}}" aria-label="{{brand.name}} home">
      <span class="brand-mark" aria-hidden="true">T<span></span></span>
      <span><strong>{{brand.name}}</strong><small>{{navigation.caption}}</small></span>
    </a>
    <nav class="site-navigation" id="siteNavigation" aria-label="Primary navigation">
      <span class="navigation-eyebrow">{{navigation.menuLabel}}</span>
      {{headerLinks}}
    </nav>
    <div class="nav-actions">
      <a class="pill primary nav-cta" data-link="{{navigation.ctaKey}}" href="{{navigation.ctaHref}}">{{navigation.cta}} <span aria-hidden="true">↗</span></a>
      <button class="menu-btn" id="menuButton" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="siteNavigation"><span></span><span></span></button>
    </div>
  </div>
</header>
