<section id="platform" class="section audience">
          <div class="container">
            <div class="reveal">
              <span class="eyebrow">Two sides. One connected platform.</span>
              <h2 class="section-title">
                Built for the traveller experience and the agency operating behind it.
              </h2>
              <p class="section-copy">
                Switch perspectives to see how the same platform serves both sides of the journey.
              </p>
              <div class="switcher" role="tablist" aria-label="Platform audience">
                <button class="active" type="button" data-audience="traveller">
                  For travellers
                </button>
                <button type="button" data-audience="partner">For partner agencies</button>
              </div>
            </div>

            <div class="audience-grid reveal">
              <div class="audience-copy" id="audienceCopy"></div>
              <div class="audience-visual">
                <div class="journey-ui" id="audienceVisual"></div>
              </div>
            </div>
          </div>
        </section>
