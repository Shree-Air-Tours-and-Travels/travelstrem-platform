<section id="products" class="section">
  <div class="container">
    <div class="reveal">
      <span class="eyebrow">{{content.sections_home_products.span1}}</span>
      <h2 class="section-title">{{content.sections_home_products.h21}}</h2>
      <p class="section-copy">{{content.sections_home_products.p1}}</p>
    </div>

    <div class="products-grid" data-stagger>
      <button
        class="product-card reveal"
        type="button"
        data-product="trevio"
        aria-haspopup="dialog"
      >
        <div class="product-card__top">
          <span class="product-card__icon" aria-hidden="true">◈</span>
          <span class="product-card__status">{{content.sections_home_products.span2}}</span>
        </div>
        <h3>{{content.sections_home_products.h31}}</h3>
        <p>{{content.sections_home_products.p2}}</p>
        <ul class="product-card__points">
          <li>{{content.sections_home_products.li1}}</li>
          <li>{{content.sections_home_products.li2}}</li>
        </ul>
        <span class="product-card__action">{{content.sections_home_products.span3}}<span aria-hidden="true">→</span></span>
      </button>

      <button
        class="product-card reveal"
        type="button"
        data-product="trevista"
        aria-haspopup="dialog"
      >
        <div class="product-card__top">
          <span class="product-card__icon" aria-hidden="true">✈</span>
          <span class="product-card__status">{{content.sections_home_products.span4}}</span>
        </div>
        <h3>{{content.sections_home_products.h32}}</h3>
        <p>{{content.sections_home_products.p3}}</p>
        <ul class="product-card__points">
          <li>{{content.sections_home_products.li3}}</li>
          <li>{{content.sections_home_products.li4}}</li>
        </ul>
        <span class="product-card__action">{{content.sections_home_products.span5}}<span aria-hidden="true">→</span></span>
      </button>

      <button
        class="product-card reveal"
        type="button"
        data-product="trehub"
        aria-haspopup="dialog"
      >
        <div class="product-card__top">
          <span class="product-card__icon" aria-hidden="true">⌂</span>
          <span class="product-card__status">{{content.sections_home_products.span6}}</span>
        </div>
        <h3>{{content.sections_home_products.h33}}</h3>
        <p>{{content.sections_home_products.p4}}</p>
        <ul class="product-card__points">
          <li>{{content.sections_home_products.li5}}</li>
          <li>{{content.sections_home_products.li6}}</li>
        </ul>
        <span class="product-card__action">{{content.sections_home_products.span7}}<span aria-hidden="true">→</span></span>
      </button>

      <button
        class="product-card reveal"
        type="button"
        data-product="hub"
        aria-haspopup="dialog"
      >
        <div class="product-card__top">
          <span class="product-card__icon" aria-hidden="true">◆</span>
          <span class="product-card__status">{{content.sections_home_products.span8}}</span>
        </div>
        <h3>{{content.sections_home_products.h34}}</h3>
        <p>{{content.sections_home_products.p5}}</p>
        <ul class="product-card__points">
          <li>{{content.sections_home_products.li7}}</li>
          <li>{{content.sections_home_products.li8}}</li>
        </ul>
        <span class="product-card__action">{{content.sections_home_products.span9}}<span aria-hidden="true">→</span></span>
      </button>

      <button
        class="product-card reveal"
        type="button"
        data-product="partnertrem"
        aria-haspopup="dialog"
      >
        <div class="product-card__top">
          <span class="product-card__icon" aria-hidden="true">▣</span>
          <span class="product-card__status">{{content.sections_home_products.span10}}</span>
        </div>
        <h3>{{content.sections_home_products.h35}}</h3>
        <p>{{content.sections_home_products.p6}}</p>
        <ul class="product-card__points">
          <li>{{content.sections_home_products.li9}}</li>
          <li>{{content.sections_home_products.li10}}</li>
        </ul>
        <span class="product-card__action">{{content.sections_home_products.span11}}<span aria-hidden="true">→</span></span>
      </button>
    </div>
  </div>

  <div class="modal-backdrop" id="productModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="productModalTitle">
      <button
        class="modal__close"
        id="productModalClose"
        type="button"
        aria-label="Close product details"
      >
        ×
      </button>
      <div class="modal__content" id="productModalContent"></div>
      <div class="modal__footer">
        <a class="pill secondary" id="productModalDetails" href="#" hidden></a>
        <a
          class="pill primary"
          id="productModalLink"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
          >{{content.sections_home_products.a1}}</a
        >
      </div>
    </div>
  </div>
</section>
