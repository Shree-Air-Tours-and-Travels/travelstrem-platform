<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f766e" />
  <title>Trevista — Tours & Holiday Packages</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --primary: #0f766e;
      --primary-dark: #0a5f59;
      --primary-soft: #dff7f2;
      --primary-faint: #f3fbf9;
      --ink: #122a29;
      --muted: #687a78;
      --line: #dbe7e5;
      --surface: #fff;
      --soft: #f3f8f7;
      --danger: #c62828;
      --danger-soft: #fff0f0;
      --warning: #a96108;
      --warning-soft: #fff6df;
      --success: #16813e;
      --success-soft: #e9f8ee;
      --blue: #2563eb;
      --blue-soft: #eaf1ff;
      --shadow: 0 18px 60px rgba(15, 118, 110, .12);
      --shadow-sm: 0 8px 26px rgba(15, 42, 41, .07);
      --radius: 20px;
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-behavior: smooth
    }

    body {
      margin: 0;
      background: #f7fbfa;
      color: var(--ink);
      font-family: Inter, system-ui, sans-serif
    }

    button,
    input,
    select,
    textarea {
      font: inherit
    }

    button {
      cursor: pointer
    }

    a {
      color: inherit
    }

    .app {
      min-height: 100vh
    }

    .container {
      width: min(1220px, 92vw);
      margin: auto
    }

    .topbar {
      height: 72px;
      position: sticky;
      top: 0;
      z-index: 80;
      background: rgba(255, 255, 255, .94);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(219, 231, 229, .9);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5vw;
    }

    .brand {
      border: 0;
      background: transparent;
      padding: 0;
      display: flex;
      gap: 11px;
      align-items: center;
      color: var(--ink)
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: linear-gradient(135deg, var(--primary), #2dd4bf);
      color: white;
      display: grid;
      place-items: center;
      box-shadow: 0 9px 22px rgba(15, 118, 110, .22)
    }

    .brand-text {
      font-weight: 800;
      font-size: 17px;
      letter-spacing: -.35px;
      text-align: left
    }

    .brand-text small {
      display: block;
      color: #778885;
      font-size: 9px;
      letter-spacing: 1.25px;
      margin-top: 2px
    }

    .nav {
      display: flex;
      gap: 26px;
      align-items: center
    }

    .nav button {
      border: 0;
      background: transparent;
      padding: 10px 0;
      color: #5d6f6d;
      font-size: 13px;
      font-weight: 700
    }

    .nav button.active,
    .nav button:hover {
      color: var(--primary)
    }

    .header-actions {
      display: flex;
      gap: 9px;
      align-items: center
    }

    .btn,
    .btn-icon {
      border: 0;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 800;
      transition: .2s ease;
      white-space: nowrap
    }

    .btn {
      padding: 13px 17px
    }

    .btn:hover {
      transform: translateY(-1px)
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      box-shadow: 0 9px 22px rgba(15, 118, 110, .2)
    }

    .btn-primary:hover {
      background: var(--primary-dark)
    }

    .btn-secondary {
      background: var(--primary-soft);
      color: var(--primary)
    }

    .btn-outline {
      background: white;
      color: var(--ink);
      border: 1px solid var(--line)
    }

    .btn-ghost {
      background: transparent;
      color: var(--ink)
    }

    .btn-danger {
      background: var(--danger-soft);
      color: var(--danger)
    }

    .btn-icon {
      width: 41px;
      height: 41px;
      background: var(--soft);
      color: var(--ink)
    }

    .btn-full {
      width: 100%
    }

    .hero {
      min-height: 610px;
      padding: 70px 0 125px;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(7, 42, 39, .82), rgba(7, 42, 39, .28)),
        url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1800&q=85') center/cover;
      color: white;
    }

    .hero:after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 160px;
      background: linear-gradient(transparent, #f7fbfa)
    }

    .hero-grid {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      gap: 45px;
      align-items: center
    }

    .eyebrow {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      background: rgba(255, 255, 255, .14);
      border: 1px solid rgba(255, 255, 255, .25);
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      backdrop-filter: blur(10px)
    }

    h1,
    h2,
    h3,
    h4,
    p {
      margin-top: 0
    }

    h1 {
      font-size: clamp(45px, 5.2vw, 72px);
      line-height: 1.03;
      letter-spacing: -3px;
      margin: 20px 0 18px
    }

    h2 {
      font-size: 31px;
      letter-spacing: -1.1px
    }

    h3 {
      font-size: 19px;
      letter-spacing: -.3px
    }

    .hero-copy p {
      font-size: 17px;
      line-height: 1.7;
      color: rgba(255, 255, 255, .82);
      max-width: 650px
    }

    .hero-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 24px
    }

    .hero .btn-outline {
      background: rgba(255, 255, 255, .12);
      border-color: rgba(255, 255, 255, .28);
      color: white
    }

    .trust {
      display: flex;
      gap: 23px;
      flex-wrap: wrap;
      margin-top: 27px;
      color: rgba(255, 255, 255, .82);
      font-size: 12px;
      font-weight: 700
    }

    .trust span {
      display: flex;
      gap: 8px;
      align-items: center
    }

    .hero-panel {
      background: rgba(255, 255, 255, .96);
      color: var(--ink);
      border-radius: 28px;
      padding: 22px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px)
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px
    }

    .tab {
      border: 0;
      border-radius: 11px;
      background: var(--soft);
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 800;
      color: #5a6b69
    }

    .tab.active {
      background: var(--ink);
      color: white
    }

    .search-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px
    }

    .field {
      background: white;
      border: 1px solid var(--line);
      border-radius: 13px;
      padding: 10px 12px;
      min-width: 0
    }

    .field label {
      display: block;
      font-size: 9px;
      letter-spacing: .75px;
      text-transform: uppercase;
      color: #7d8e8b;
      font-weight: 800;
      margin-bottom: 6px
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font-weight: 700;
      min-width: 0
    }

    .full {
      grid-column: 1/-1
    }

    .section {
      padding: 63px 0
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      margin-bottom: 24px
    }

    .section-head p {
      color: var(--muted);
      margin-bottom: 0
    }

    .card {
      background: white;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 9px 28px rgba(15, 42, 41, .04)
    }

    .destination-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px
    }

    .destination-card {
      height: 260px;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      background-size: cover;
      background-position: center
    }

    .destination-card:after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(transparent 35%, rgba(8, 33, 31, .85))
    }

    .destination-copy {
      position: absolute;
      left: 17px;
      right: 17px;
      bottom: 16px;
      z-index: 2;
      color: white
    }

    .destination-copy h3 {
      margin: 0 0 4px
    }

    .destination-copy p {
      font-size: 11px;
      color: rgba(255, 255, 255, .78);
      margin: 0
    }

    .package-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px
    }

    .package-card {
      overflow: hidden;
      transition: .2s ease;
      cursor: pointer
    }

    .package-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-sm)
    }

    .package-img {
      height: 200px;
      background-size: cover;
      background-position: center;
      position: relative
    }

    .package-badges {
      position: absolute;
      left: 13px;
      top: 13px;
      display: flex;
      gap: 7px;
      flex-wrap: wrap
    }

    .package-body {
      padding: 17px
    }

    .package-title {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: start
    }

    .package-title h3 {
      font-size: 17px;
      margin-bottom: 5px
    }

    .rating {
      color: #efa719;
      font-size: 12px;
      white-space: nowrap
    }

    .package-meta {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 11px;
      margin: 12px 0
    }

    .package-meta span {
      display: flex;
      gap: 5px;
      align-items: center
    }

    .package-footer {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: end;
      padding-top: 13px;
      border-top: 1px solid #edf2f1
    }

    .price-big {
      font-size: 22px;
      font-weight: 800
    }

    .pill {
      display: inline-flex;
      padding: 6px 9px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800
    }

    .pill-success {
      background: var(--success-soft);
      color: var(--success)
    }

    .pill-warning {
      background: var(--warning-soft);
      color: var(--warning)
    }

    .pill-blue {
      background: var(--blue-soft);
      color: var(--blue)
    }

    .pill-danger {
      background: var(--danger-soft);
      color: var(--danger)
    }

    .feature-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px
    }

    .feature {
      padding: 18px
    }

    .feature-icon {
      width: 45px;
      height: 45px;
      border-radius: 14px;
      background: var(--primary-soft);
      color: var(--primary);
      display: grid;
      place-items: center;
      margin-bottom: 14px
    }

    .feature p {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.6;
      margin: 0
    }

    .page {
      padding: 30px 0 84px
    }

    .crumbs {
      display: flex;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 20px
    }

    .crumbs button {
      border: 0;
      background: transparent;
      padding: 0;
      color: inherit
    }

    .page-title {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      margin-bottom: 22px
    }

    .page-title p {
      color: var(--muted);
      font-size: 13px;
      margin: 6px 0 0
    }

    .layout-filter {
      display: grid;
      grid-template-columns: 274px 1fr;
      gap: 22px
    }

    .filters {
      padding: 18px;
      height: max-content;
      position: sticky;
      top: 90px
    }

    .filter-group {
      padding: 15px 0;
      border-bottom: 1px solid #edf2f1
    }

    .filter-group:last-child {
      border-bottom: 0
    }

    .filter-group h4 {
      font-size: 13px;
      margin-bottom: 11px
    }

    .check {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 7px 0;
      color: #536462;
      font-size: 12px
    }

    .sort {
      border: 1px solid var(--line);
      background: white;
      border-radius: 11px;
      padding: 10px 12px;
      font-weight: 700
    }

    .result-card {
      display: grid;
      grid-template-columns: 250px 1fr 185px;
      gap: 18px;
      padding: 17px;
      margin-bottom: 14px
    }

    .result-img {
      height: 180px;
      border-radius: 15px;
      background-size: cover;
      background-position: center
    }

    .amenities {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-top: 12px
    }

    .amenity {
      background: var(--soft);
      color: #50615f;
      border-radius: 8px;
      padding: 7px 9px;
      font-size: 10px;
      font-weight: 800
    }

    .muted {
      color: var(--muted)
    }

    .small {
      font-size: 12px
    }

    .price {
      text-align: right
    }

    .price strong {
      font-size: 22px
    }

    .price small {
      display: block;
      color: var(--muted);
      margin: 5px 0 11px
    }

    .details-grid {
      display: grid;
      grid-template-columns: 1fr 345px;
      gap: 22px
    }

    .sticky {
      position: sticky;
      top: 90px;
      height: max-content
    }

    .panel {
      padding: 21px;
      margin-bottom: 17px
    }

    .gallery {
      display: grid;
      grid-template-columns: 1.25fr .75fr .75fr;
      grid-template-rows: 190px 190px;
      gap: 9px;
      margin-bottom: 22px
    }

    .gallery div {
      border-radius: 15px;
      background-size: cover;
      background-position: center;
      position: relative;
      overflow: hidden
    }

    .gallery .hero-img {
      grid-row: 1/3
    }

    .gallery .last:after {
      content: "View all 42 photos";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, .46);
      display: grid;
      place-items: center;
      color: white;
      font-weight: 800;
      font-size: 13px
    }

    .anchor-tabs {
      display: flex;
      gap: 8px;
      overflow: auto;
      padding-bottom: 4px;
      margin-bottom: 17px
    }

    .anchor-tabs button {
      border: 1px solid var(--line);
      background: white;
      padding: 10px 13px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 800
    }

    .anchor-tabs button.active {
      background: var(--primary-soft);
      border-color: #b9e8df;
      color: var(--primary)
    }

    .overview-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px
    }

    .overview-item {
      background: var(--soft);
      padding: 13px;
      border-radius: 12px;
      font-size: 11px;
      color: #536462
    }

    .overview-item strong {
      display: block;
      color: var(--ink);
      margin-top: 6px;
      font-size: 13px
    }

    .timeline {
      position: relative;
      padding-left: 32px
    }

    .timeline:before {
      content: "";
      position: absolute;
      left: 11px;
      top: 10px;
      bottom: 10px;
      width: 2px;
      background: #cbd9d6
    }

    .timeline-item {
      position: relative;
      padding-bottom: 21px
    }

    .timeline-item:before {
      content: "";
      position: absolute;
      left: -27px;
      top: 3px;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: white;
      border: 3px solid var(--primary)
    }

    .timeline-item:last-child {
      padding-bottom: 0
    }

    .timeline-item p {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.6;
      margin: 5px 0 0
    }

    .day-card {
      padding: 17px;
      margin-bottom: 13px
    }

    .day-header {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 13px;
      align-items: center
    }

    .day-number {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--primary-soft);
      color: var(--primary);
      display: grid;
      place-items: center;
      font-weight: 900
    }

    .day-content {
      padding-top: 14px;
      margin-top: 14px;
      border-top: 1px solid #edf2f1
    }

    .day-content p {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.7
    }

    .meal-tags {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-top: 10px
    }

    .included-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 13px
    }

    .info-list {
      display: grid;
      gap: 12px
    }

    .info-row {
      display: flex;
      gap: 12px;
      align-items: flex-start
    }

    .info-row i {
      color: var(--primary);
      flex: 0 0 auto
    }

    .info-row p {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.55;
      margin: 4px 0 0
    }

    .summary {
      padding: 20px
    }

    .summary-box {
      background: var(--soft);
      padding: 13px;
      border-radius: 12px;
      margin: 12px 0
    }

    .line-item {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 9px 0;
      color: #536462;
      font-size: 12px
    }

    .line-item.total {
      border-top: 1px solid var(--line);
      margin-top: 7px;
      padding-top: 15px;
      color: var(--ink);
      font-size: 17px;
      font-weight: 800
    }

    .departure-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px
    }

    .departure {
      border: 1px solid var(--line);
      background: white;
      border-radius: 14px;
      padding: 14px;
      text-align: left
    }

    .departure.active {
      border: 2px solid var(--primary);
      background: #fbfffe
    }

    .departure strong {
      display: block
    }

    .departure span {
      font-size: 11px;
      color: var(--muted);
      display: block;
      margin-top: 5px
    }

    .room-grid,
    .transport-grid,
    .addon-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 13px
    }

    .select-card {
      padding: 17px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: white
    }

    .select-card.active {
      border: 2px solid var(--primary);
      background: #fbfffe
    }

    .select-card h3 {
      margin-bottom: 5px
    }

    .select-card p {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.55;
      min-height: 52px
    }

    .amount {
      font-size: 23px;
      font-weight: 800;
      margin: 12px 0
    }

    .steps {
      display: flex;
      align-items: center;
      margin-bottom: 25px;
      overflow: auto
    }

    .step {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #83918f;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap
    }

    .step-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #e7eeee;
      display: grid;
      place-items: center
    }

    .step.active,
    .step.done {
      color: var(--primary)
    }

    .step.active .step-dot,
    .step.done .step-dot {
      background: var(--primary);
      color: white
    }

    .step-line {
      height: 2px;
      background: #dae5e3;
      flex: 1;
      min-width: 30px;
      margin: 0 8px
    }

    .step-line.done {
      background: var(--primary)
    }

    .booking-grid {
      display: grid;
      grid-template-columns: 1fr 350px;
      gap: 22px
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 13px
    }

    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 7px
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 12px;
      background: white;
      outline: 0
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, .1)
    }

    .traveller-card {
      padding: 18px;
      margin-bottom: 14px
    }

    .counter {
      display: flex;
      gap: 8px;
      align-items: center
    }

    .counter button {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      border: 1px solid var(--line);
      background: white;
      font-weight: 800
    }

    @media(max-width:700px){ .stay-head{grid-template-columns:1fr}.stay-photo{min-height:190px}.spec-grid,.service-details{grid-template-columns:1fr}.contact-card{grid-template-columns:42px 1fr}.contact-card>.btn{grid-column:1/-1} }

</head>

<body>
  <div class="app">
    <header class="topbar">
      <button class="brand" onclick="navigate('home')">
        <span class="brand-mark"><i data-lucide="palmtree"></i></span>

        <button class="btn btn-ghost"><i data-lucide="user-round" size="17"></i> Akshat</button>
      </div>
    </header>

    <main id="view"></main>

    <nav class="mobile-nav">
      <button onclick="navigate('home')"><i data-lucide="compass" size="18"></i>Explore</button>
      <button onclick="navigate('packages')"><i data-lucide="map" size="18"></i>Packages</button>
      <button onclick="navigate('custom')"><i data-lucide="wand-sparkles" size="18"></i>Custom</button>
      <button onclick="navigate('bookings')"><i data-lucide="ticket-check" size="18"></i>Bookings</button>
    </nav>

    <div id="modal" class="modal-backdrop" onclick="closeModal(event)">
      <div class="modal" onclick="event.stopPropagation()">
        <div style="display:flex;justify-content:space-between;gap:16px;align-items:center">

    </div>

    <div id="toast" class="toast"></div>
  </div>

  <script>
    const packageImages = {
      bali: "https://images.unsplash.com/photo-1537996194471-e657df975ab4?auto=format&fit=crop&w=1200&q=85",
      dubai: "https://images.unsplash.com/photo-1512453979798-5ea266f8880c?auto=format&fit=crop&w=1200&q=85",
      europe: "https://images.unsplash.com/photo-1499856871958-5b9627545d1a?auto=format&fit=crop&w=1200&q=85",
      thailand: "https://images.unsplash.com/photo-1528181304800-259b08848526?auto=format&fit=crop&w=1200&q=85",
      kashmir: "https://images.unsplash.com/photo-1566837497312-7be7830ae9b5?auto=format&fit=crop&w=1200&q=85",
      maldives: "https://images.unsplash.com/photo-1514282401047-d79a71a590e8?auto=format&fit=crop&w=1200&q=85",
      room: "https://images.unsplash.com/photo-1611892440504-42a792e24d32?auto=format&fit=crop&w=900&q=80",
      resort: "https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=900&q=80",
      activity: "https://images.unsplash.com/photo-1530789253388-582c481c54b0?auto=format&fit=crop&w=900&q=80"
    };

    const packages = [
      { id: "bali", title: "Bali Tropical Escape", destination: "Bali, Indonesia", duration: "6D / 5N", price: 62999, rating: "4.8", image: packageImages.bali, tag: "Best seller", type: "International" },
      { id: "dubai", title: "Dubai City & Desert", destination: "Dubai, UAE", duration: "5D / 4N", price: 57999, rating: "4.7", image: packageImages.dubai, tag: "Popular", type: "International" },
      { id: "europe", title: "Classic Europe Highlights", destination: "France, Switzerland, Italy", duration: "10D / 9N", price: 189999, rating: "4.9", image: packageImages.europe, tag: "Premium", type: "International" },
      { id: "thailand", title: "Thailand Island Discovery", destination: "Bangkok, Phuket, Krabi", duration: "7D / 6N", price: 74999, rating: "4.6", image: packageImages.thailand, tag: "Island break", type: "International" },
      { id: "kashmir", title: "Kashmir Scenic Retreat", destination: "Srinagar, Gulmarg, Pahalgam", duration: "6D / 5N", price: 38999, rating: "4.8", image: packageImages.kashmir, tag: "Domestic favourite", type: "Domestic" },
      { id: "maldives", title: "Maldives Water Villa Stay", destination: "Maldives", duration: "5D / 4N", price: 129999, rating: "4.9", image: packageImages.maldives, tag: "Honeymoon pick", type: "International" }
    ];

    const state = {
      selectedPackage: "bali",
      departure: "03 Sep 2026",
      roomType: "Deluxe Room",
      roomPrice: 0,
      transport: "Shared transfers",
      transportPrice: 0,
      travellers: 2,
      children: 0,
      addons: ["Uluwatu sunset tour"],
      basePrice: 125998,
      total: 134496,
      paymentMethod: "Card",
      bookingId: "TVS-2026-2842",
      customBudget: "₹1,00,000–₹1,50,000"
    };

    const icon = (name, size = 18) => `<i data-lucide="${name}" size="${size}"></i>`;
    const fmt = n => "₹" + Number(n).toLocaleString("en-IN");
    const pkg = () => packages.find(p => p.id === state.selectedPackage) || packages[0];

    function initIcons() { setTimeout(() => lucide.createIcons(), 0) }
    function setView(html) { document.getElementById("view").innerHTML = html; window.scrollTo({ top: 0, behavior: "smooth" }); initIcons() }
    function updateNav(key) { document.querySelectorAll("[data-nav]").forEach(b => b.classList.toggle("active", b.dataset.nav === key)) }
    function crumbs(items) { return `<div class="crumbs">${items.map((x, i) => i === items.length - 1 ? `<strong>${x.label}</strong>` : `<button onclick="${x.action}">${x.label}</button>${icon("chevron-right", 13)}`).join("")}</div>` }
    function steps(active) { const labels = ["Departure", "Customize", "Travellers", "Review", "Payment", "Confirmation"]; return `<div class="steps">${labels.map((s, i) => `${i ? `<div class="step-line ${i <= active ? "done" : ""}"></div>` : ""}<div class="step ${i < active ? "done" : i === active ? "active" : ""}"><span class="step-dot">${i < active ? icon("check", 14) : i + 1}</span><span>${s}</span></div>`).join("")}</div>` }

    function navigate(screen) {
      const routes = {
        home: renderHome, packages: renderPackages, "package-details": renderPackageDetails, departure: renderDeparture,
        customize: renderCustomize, travellers: renderTravellers, review: renderReview, payment: renderPayment,
        failure: renderFailure, confirmation: renderConfirmation, bookings: renderBookings, "booking-details": renderBookingDetails,
        custom: renderCustomTrip, enquiry: renderEnquiry, corporate: renderCorporate
      };
      (routes[screen] || renderHome)()
    }
    function openPackage(id) { state.selectedPackage = id; recalculate(); navigate("package-details") }
    function recalculate() {
      const base = pkg().price * state.travellers;
      const child = state.children ? Math.round(pkg().price * .65) * state.children : 0;
      const addOnTotal = state.addons.length * 1999;
      state.basePrice = base + child;
      state.total = base + child + state.roomPrice + state.transportPrice + addOnTotal + 5499;
    }
    function renderHome() {
      updateNav("home");
      setView(`
    <section class="hero">
      <div class="container hero-grid">
        <div class="hero-copy">
          <span class="eyebrow">${icon("sparkles", 15)} Curated holidays, customisable down to the details.</span>
          <h1>Discover, customise, and book complete holiday packages.</h1>
          <p>Explore curated tours, compare hotels and inclusions, customise your itinerary, and manage the entire trip from one Trevista booking flow.</p>
          <div class="hero-actions">
            <button class="btn btn-primary" onclick="navigate('packages')">${icon("map", 17)} Explore packages</button>
            <button class="btn btn-outline" onclick="navigate('custom')">${icon("wand-sparkles", 17)} Build a custom trip</button>
          </div>
          <div class="trust">
            <span>${icon("badge-check", 18)} Verified stays and experiences</span>
            <span>${icon("badge-indian-rupee", 18)} Transparent package pricing</span>
            <span>${icon("headphones", 18)} Dedicated trip support</span>
          </div>
        </div>
        <div class="hero-panel">
          <div class="tabs"><button class="tab active">Holiday packages</button><button class="tab" onclick="navigate('custom')">Custom trip</button></div>
          <div class="search-grid">
            <div class="field full"><label>Destination</label><input value="Bali, Indonesia"></div>
            <div class="field"><label>Travel month</label><select><option>August 2026</option><option>September 2026</option><option>October 2026</option></select></div>
            <div class="field"><label>Travellers</label><select><option>2 adults</option><option>Family</option><option>Group</option></select></div>
            <div class="field"><label>Trip style</label><select><option>Leisure</option><option>Honeymoon</option><option>Family</option><option>Adventure</option></select></div>
            <div class="field"><label>Budget</label><select><option>₹50k–₹1L</option><option>₹1L–₹2L</option><option>₹2L+</option></select></div>
            <button class="btn btn-primary full" onclick="navigate('packages')">${icon("search", 17)} Search packages</button>
          </div>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="section-head"><div><h2>Explore by destination</h2><p>Popular places with ready-to-book and customisable packages.</p></div></div>
        <div class="destination-grid">
          ${destinationCard("Bali", "Tropical escapes and island experiences", packageImages.bali, "bali")}
          ${destinationCard("Dubai", "City attractions, desert, and luxury", packageImages.dubai, "dubai")}
          ${destinationCard("Europe", "Multi-country guided holidays", packageImages.europe, "europe")}
          ${destinationCard("Kashmir", "Mountains, valleys, and scenic stays", packageImages.kashmir, "kashmir")}
        </div>
      </div>
    </section>

    <section class="section" style="padding-top:0">
      <div class="container">
        <div class="section-head"><div><h2>Featured holiday packages</h2><p>Curated packages with hotels, transfers, sightseeing, and support.</p></div><button class="btn btn-outline" onclick="navigate('packages')">View all packages</button></div>
        <div class="package-grid">${packages.slice(0, 3).map(packageCard).join("")}</div>
      </div>
    </section>

    <section class="section" style="padding-top:0">
      <div class="container">
        <div class="feature-grid">
          <div class="card feature"><div class="feature-icon">${icon("sliders-horizontal")}</div><h3>Customise freely</h3><p>Change hotels, room types, transfers, sightseeing, meals, and activities before checkout.</p></div>
          <div class="card feature"><div class="feature-icon">${icon("route")}</div><h3>Day-wise clarity</h3><p>Review the complete itinerary, travel times, inclusions, and exclusions before booking.</p></div>
          <div class="card feature"><div class="feature-icon">${icon("shield-check")}</div><h3>Verified partners</h3><p>Hotels, guides, transfers, and experience partners are validated before listing.</p></div>
          <div class="card feature"><div class="feature-icon">${icon("calendar-check")}</div><h3>Manage after booking</h3><p>Download vouchers, add travellers, request changes, and contact support from one dashboard.</p></div>
        </div>
      </div>
    </section>
  `)
    }
    function destinationCard(title, desc, img, id) { return `<div class="destination-card" style="background-image:url('${img}')" onclick="openPackage('${id}')"><div class="destination-copy"><h3>${title}</h3><p>${desc}</p></div></div>` }
    function packageCard(p) {
      return `<div class="card package-card" onclick="openPackage('${p.id}')">
  <div class="package-img" style="background-image:url('${p.image}')"><div class="package-badges"><span class="pill pill-success">${p.tag}</span><span class="pill pill-blue">${p.type}</span></div></div>
  <div class="package-body"><div class="package-title"><div><h3>${p.title}</h3><div class="small muted">${p.destination}</div></div><div class="rating">★★★★★ ${p.rating}</div></div>
  <div class="package-meta"><span>${icon("calendar-days", 14)} ${p.duration}</span><span>${icon("hotel", 14)} 4-star stays</span><span>${icon("car", 14)} Transfers</span></div>
  <div class="package-footer"><div><span class="small muted">Starting from</span><div class="price-big">${fmt(p.price)}</div><span class="small muted">per person</span></div><button class="btn btn-primary">View package</button></div></div>
</div>`}
    function renderPackages() {
      updateNav("packages");
      setView(`<section class="page"><div class="container">
    ${crumbs([{ label: "Home", action: "navigate('home')" }, { label: "Holiday packages" }])}
    <div class="page-title"><div><h2>Holiday packages</h2><p>36 packages found · International and domestic destinations</p></div><select class="sort"><option>Recommended</option><option>Lowest price</option><option>Best rated</option><option>Shortest duration</option></select></div>
    <div class="layout-filter">

      <div class="card panel"><h3>Your enquiry</h3><div class="form-grid"><div class="form-group"><label>Name</label><input value="Akshat Goyal"></div><div class="form-group"><label>Mobile</label><input value="+91 98765 43210"></div><div class="form-group"><label>Email</label><input value="akshat@example.com"></div><div class="form-group"><label>Preferred callback time</label><select><option>Any time</option><option>Morning</option><option>Afternoon</option><option>Evening</option></select></div><div class="form-group full"><label>Message</label><textarea rows="5" placeholder="Tell us what you want to know or change"></textarea></div></div></div>
      <button class="btn btn-primary btn-full" onclick="toast('Enquiry submitted — holiday expert assigned')">Submit enquiry</button>
    </div><aside class="card summary sticky"><div class="label">Package reference</div><h3 style="margin:8px 0">${pkg().title}</h3><div class="summary-box">${pkg().duration}<br><span class="small muted">${pkg().destination}</span></div><div class="small muted" style="line-height:1.6">Average callback time during working hours: under 15 minutes.</div><button class="btn btn-outline btn-full" style="margin-top:13px" onclick="toast('WhatsApp conversation opened')">${icon("message-circle", 17)} Continue on WhatsApp</button></aside></div>
  </div></section>`)
    }
    function renderCorporate() {
      updateNav("custom");
      setView(`<section class="page"><div class="container">
    ${crumbs([{ label: "Home", action: "navigate('home')" }, { label: "Corporate tours" }])}
    <div class="page-title"><div><h2>Corporate tours and group travel</h2><p>Offsites, incentive travel, conferences, and large-group holiday planning.</p></div></div>
    <div class="corporate-grid">
      <div class="card corporate-card"><div class="feature-icon">${icon("users")}</div><h3>Team offsites</h3><p class="small muted">Accommodation, activities, transfers, meals, and facilitated events.</p></div>
      <div class="card corporate-card"><div class="feature-icon">${icon("trophy")}</div><h3>Incentive travel</h3><p class="small muted">Premium reward trips with curated destination experiences.</p></div>
      <div class="card corporate-card"><div class="feature-icon">${icon("presentation")}</div><h3>Conference travel</h3><p class="small muted">Delegate travel, hotel inventory, airport logistics, and support desk.</p></div>

  </div></section>`)
    }
    function scrollToId(id) { document.getElementById(id)?.scrollIntoView({ behavior: "smooth", block: "start" }) }
    function openModal(title, body) { document.getElementById("modalTitle").textContent = title; document.getElementById("modalBody").innerHTML = body; document.getElementById("modal").classList.add("show"); initIcons() }
    function closeModal(e) { if (e && e.target.id !== "modal") return; document.getElementById("modal").classList.remove("show") }
    function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2100) }
    renderHome()
  </script>
