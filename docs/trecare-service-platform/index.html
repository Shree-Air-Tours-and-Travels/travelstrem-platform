<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <title>TreCare — Travel Services Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      :root {
        --primary: #0f766e;
        --primary-dark: #0a5d58;
        --primary-soft: #dff7f2;
        --primary-faint: #f2fbf9;
        --ink: #122a29;
        --muted: #677977;
        --line: #dbe7e5;
        --surface: #ffffff;
        --soft: #f3f8f7;
        --danger: #c62828;
        --danger-soft: #fff0f0;
        --warning: #a86108;
        --warning-soft: #fff6df;
        --success: #16813e;
        --success-soft: #e9f8ee;
        --blue: #2563eb;
        --blue-soft: #eaf1ff;
        --shadow: 0 18px 60px rgba(15, 118, 110, 0.12);
        --shadow-sm: 0 8px 26px rgba(15, 42, 41, 0.07);
        --radius: 20px;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: #f7fbfa;
        color: var(--ink);
        font-family: Inter, system-ui, sans-serif;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      a {
        color: inherit;
      }
      .app {
        min-height: 100vh;
      }
      .container {
        width: min(1220px, 92vw);
        margin: auto;
      }
      .topbar {
        height: 72px;
        position: sticky;
        top: 0;
        z-index: 80;
        background: rgba(255, 255, 255, 0.94);
        backdrop-filter: blur(18px);
        border-bottom: 1px solid rgba(219, 231, 229, 0.9);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 5vw;
      }
      .brand {
        border: 0;
        background: transparent;
        padding: 0;
        display: flex;
        gap: 11px;
        align-items: center;
        color: var(--ink);
      }
      .brand-mark {
        width: 42px;
        height: 42px;
        border-radius: 13px;
        background: linear-gradient(135deg, var(--primary), #2dd4bf);
        color: white;
        display: grid;
        place-items: center;
        box-shadow: 0 9px 22px rgba(15, 118, 110, 0.22);
      }
      .brand-text {
        font-weight: 800;
        font-size: 17px;
        letter-spacing: -0.35px;
        text-align: left;
      }
      .brand-text small {
        display: block;
        color: #778885;
        font-size: 9px;
        letter-spacing: 1.25px;
        margin-top: 2px;
      }
      .nav {
        display: flex;
        gap: 26px;
        align-items: center;
      }
      .nav button {
        border: 0;
        background: transparent;
        padding: 10px 0;
        color: #5d6f6d;
        font-size: 13px;
        font-weight: 700;
      }
      .nav button.active,
      .nav button:hover {
        color: var(--primary);
      }
      .header-actions {
        display: flex;
        gap: 9px;
        align-items: center;
      }
      .btn,
      .btn-icon {
        border: 0;
        border-radius: 12px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-weight: 800;
        transition: 0.2s ease;
        white-space: nowrap;
      }
      .btn {
        padding: 13px 17px;
      }
      .btn:hover {
        transform: translateY(-1px);
      }
      .btn-primary {
        background: var(--primary);
        color: #fff;
        box-shadow: 0 9px 22px rgba(15, 118, 110, 0.19);
      }
      .btn-primary:hover {
        background: var(--primary-dark);
      }
      .btn-secondary {
        background: var(--primary-soft);
        color: var(--primary);
      }
      .btn-outline {
        background: #fff;
        color: var(--ink);
        border: 1px solid var(--line);
      }
      .btn-ghost {
        background: transparent;
        color: var(--ink);
      }
      .btn-danger {
        background: var(--danger-soft);
        color: var(--danger);
      }
      .btn-icon {
        width: 41px;
        height: 41px;
        background: var(--soft);
        color: var(--ink);
      }
      .btn-full {
        width: 100%;
      }
      .hero {
        padding: 58px 0 102px;
        background:
          radial-gradient(circle at 88% 15%, rgba(45, 212, 191, 0.21), transparent 31%),
          linear-gradient(180deg, #eafbf7, #f7fbfa);
      }
      .hero-grid {
        display: grid;
        grid-template-columns: 1.05fr 0.95fr;
        gap: 46px;
        align-items: center;
      }
      .eyebrow {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        background: #fff;
        border: 1px solid #cdebe5;
        color: var(--primary);
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 800;
      }
      h1,
      h2,
      h3,
      h4,
      p {
        margin-top: 0;
      }
      h1 {
        font-size: clamp(44px, 5vw, 70px);
        line-height: 1.04;
        letter-spacing: -3px;
        margin: 19px 0 17px;
      }
      h2 {
        font-size: 31px;
        letter-spacing: -1.1px;
      }
      h3 {
        font-size: 19px;
        letter-spacing: -0.3px;
      }
      .hero-copy p {
        font-size: 17px;
        line-height: 1.7;
        color: var(--muted);
        max-width: 650px;
      }
      .hero-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 25px;
      }
      .trust {
        display: flex;
        gap: 23px;
        flex-wrap: wrap;
        margin-top: 27px;
        color: #526462;
        font-size: 12px;
        font-weight: 700;
      }
      .trust span {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .hero-visual {
        height: 386px;
        position: relative;
        overflow: hidden;
        border-radius: 34px;
        background: linear-gradient(135deg, #075d57, #21c7b7);
        box-shadow: var(--shadow);
      }
      .orbit {
        position: absolute;
        width: 380px;
        height: 380px;
        border: 1px solid rgba(255, 255, 255, 0.27);
        border-radius: 50%;
        right: -145px;
        top: -135px;
      }
      .orbit:after {
        content: "✦";
        position: absolute;
        left: 50px;
        bottom: 46px;
        color: white;
        font-size: 45px;
      }
      .float-card {
        position: absolute;
        background: rgba(255, 255, 255, 0.97);
        padding: 16px;
        border-radius: 18px;
        box-shadow: var(--shadow-sm);
      }
      .fc1 {
        top: 27px;
        left: 24px;
        width: 245px;
      }
      .fc2 {
        right: 25px;
        bottom: 26px;
        width: 252px;
      }
      .fc3 {
        left: 55px;
        bottom: 52px;
        width: 148px;
        background: #123e3a;
        color: #fff;
      }
      .label {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        font-weight: 800;
        color: #7c8d8a;
      }
      .fc3 .label {
        color: #9ef2cf;
      }
      .big-number {
        font-size: 25px;
        font-weight: 800;
        margin-top: 5px;
      }
      .section {
        padding: 63px 0;
      }
      .section-head {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 20px;
        margin-bottom: 24px;
      }
      .section-head p {
        color: var(--muted);
        margin-bottom: 0;
      }
      .quick-search {
        margin-top: -52px;
        position: relative;
        z-index: 10;
      }
      .search-card {
        background: white;
        border: 1px solid #dce9e7;
        border-radius: 23px;
        padding: 18px;
        box-shadow: var(--shadow);
      }
      .search-grid {
        display: grid;
        grid-template-columns: 1.35fr 1fr 1fr 1fr auto;
        gap: 10px;
      }
      .field {
        background: white;
        border: 1px solid var(--line);
        border-radius: 13px;
        padding: 10px 12px;
        min-width: 0;
      }
      .field label {
        display: block;
        font-size: 9px;
        letter-spacing: 0.75px;
        text-transform: uppercase;
        color: #7d8e8b;
        font-weight: 800;
        margin-bottom: 6px;
      }
      .field input,
      .field select,
      .field textarea {
        width: 100%;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--ink);
        font-weight: 700;
        min-width: 0;
      }
      .service-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
      }
      .service-card {
        padding: 18px;
        position: relative;
        overflow: hidden;
        cursor: pointer;
        transition: 0.2s ease;
      }
      .service-card:hover {
        transform: translateY(-3px);
        box-shadow: var(--shadow-sm);
        border-color: #c5e4df;
      }
      .service-icon {
        width: 46px;
        height: 46px;
        border-radius: 14px;
        background: var(--primary-soft);
        color: var(--primary);
        display: grid;
        place-items: center;
        margin-bottom: 16px;
      }
      .service-card h3 {
        font-size: 16px;
        margin-bottom: 7px;
      }
      .service-card p {
        font-size: 12px;
        line-height: 1.6;
        color: var(--muted);
        margin-bottom: 13px;
      }
      .service-meta {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
      }
      .pill {
        display: inline-flex;
        padding: 6px 9px;
        border-radius: 999px;
        font-size: 10px;
        font-weight: 800;
      }
      .pill-success {
        background: var(--success-soft);
        color: var(--success);
      }
      .pill-warning {
        background: var(--warning-soft);
        color: var(--warning);
      }
      .pill-blue {
        background: var(--blue-soft);
        color: var(--blue);
      }
      .pill-danger {
        background: var(--danger-soft);
        color: var(--danger);
      }
      .card {
        background: white;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: 0 9px 28px rgba(15, 42, 41, 0.04);
      }
      .page {
        padding: 30px 0 84px;
      }
      .crumbs {
        display: flex;
        gap: 8px;
        align-items: center;
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 20px;
      }
      .crumbs button {
        border: 0;
        background: transparent;
        padding: 0;
        color: inherit;
      }
      .page-title {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 20px;
        margin-bottom: 22px;
      }
      .page-title p {
        color: var(--muted);
        font-size: 13px;
        margin: 6px 0 0;
      }
      .dashboard-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
        margin-bottom: 22px;
      }
      .stat {
        padding: 18px;
      }
      .stat-top {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
      }
      .stat strong {
        font-size: 26px;
        display: block;
        margin-top: 14px;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 12px;
      }
      .content-grid {
        display: grid;
        grid-template-columns: 1fr 345px;
        gap: 22px;
      }
      .panel {
        padding: 21px;
        margin-bottom: 17px;
      }
      .sticky {
        position: sticky;
        top: 90px;
        height: max-content;
      }
      .steps {
        display: flex;
        align-items: center;
        margin-bottom: 25px;
        overflow: auto;
      }
      .step {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #83928f;
        font-size: 11px;
        font-weight: 800;
        white-space: nowrap;
      }
      .step-dot {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #e7eeee;
        display: grid;
        place-items: center;
      }
      .step.active,
      .step.done {
        color: var(--primary);
      }
      .step.active .step-dot,
      .step.done .step-dot {
        background: var(--primary);
        color: white;
      }
      .step-line {
        height: 2px;
        background: #dae5e3;
        flex: 1;
        min-width: 30px;
        margin: 0 8px;
      }
      .step-line.done {
        background: var(--primary);
      }
      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 13px;
      }
      .form-group label {
        display: block;
        font-size: 11px;
        font-weight: 800;
        margin-bottom: 7px;
      }
      .form-group input,
      .form-group select,
      .form-group textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 11px;
        padding: 12px;
        background: #fff;
        outline: 0;
      }
      .form-group input:focus,
      .form-group select:focus,
      .form-group textarea:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.1);
      }
      .full {
        grid-column: 1/-1;
      }
      .choice-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }
      .choice-card {
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 15px;
        background: white;
        text-align: left;
      }
      .choice-card.active {
        border: 2px solid var(--primary);
        background: #fbfffe;
      }
      .choice-card h4 {
        margin-bottom: 5px;
      }
      .choice-card p {
        font-size: 11px;
        color: var(--muted);
        line-height: 1.55;
        margin-bottom: 12px;
      }
      .summary {
        padding: 20px;
      }
      .summary-box {
        background: var(--soft);
        padding: 13px;
        border-radius: 12px;
        margin: 12px 0;
      }
      .line-item {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 9px 0;
        color: #536462;
        font-size: 12px;
      }
      .line-item.total {
        border-top: 1px solid var(--line);
        margin-top: 7px;
        padding-top: 15px;
        color: var(--ink);
        font-size: 17px;
        font-weight: 800;
      }
      .info-list {
        display: grid;
        gap: 12px;
      }
      .info-row {
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }
      .info-row i {
        color: var(--primary);
        flex: 0 0 auto;
      }
      .info-row p {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.55;
        margin: 4px 0 0;
      }
      .timeline {
        position: relative;
        padding-left: 30px;
      }
      .timeline:before {
        content: "";
        position: absolute;
        left: 10px;
        top: 8px;
        bottom: 8px;
        width: 2px;
        background: #cad9d6;
      }
      .timeline-item {
        position: relative;
        padding-bottom: 21px;
      }
      .timeline-item:before {
        content: "";
        position: absolute;
        left: -25px;
        top: 3px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: white;
        border: 3px solid var(--primary);
      }
      .timeline-item:last-child {
        padding-bottom: 0;
      }
      .timeline-item p {
        font-size: 11px;
        color: var(--muted);
        margin: 4px 0 0;
      }
      .document-row,
      .order-row,
      .plan-row,
      .product-row,
      .option-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 16px;
        align-items: center;
        padding: 14px 0;
        border-bottom: 1px solid #edf2f1;
      }
      .document-row:last-child,
      .order-row:last-child,
      .plan-row:last-child,
      .product-row:last-child,
      .option-row:last-child {
        border-bottom: 0;
      }
      .document-main {
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }
      .doc-icon {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: var(--primary-soft);
        color: var(--primary);
        display: grid;
        place-items: center;
        flex: 0 0 auto;
      }
      .upload-box {
        border: 1.5px dashed #bcd5d1;
        border-radius: 15px;
        padding: 22px;
        text-align: center;
        background: #fbfefe;
      }
      .upload-box i {
        color: var(--primary);
      }
      .upload-box p {
        font-size: 11px;
        color: var(--muted);
        margin: 7px 0 0;
      }
      .compare-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 13px;
      }
      .plan {
        padding: 17px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: white;
      }
      .plan.active {
        border: 2px solid var(--primary);
        background: #fbfffe;
      }
      .plan .amount {
        font-size: 24px;
        font-weight: 800;
        margin: 12px 0;
      }
      .plan ul {
        padding-left: 17px;
        color: #526461;
        font-size: 11px;
        line-height: 1.8;
        min-height: 105px;
      }
      .route-card {
        padding: 18px;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 18px;
        align-items: center;
      }
      .route-main {
        display: flex;
        gap: 13px;
        align-items: center;
      }
      .vehicle-icon {
        width: 50px;
        height: 50px;
        border-radius: 15px;
        background: var(--primary-soft);
        color: var(--primary);
        display: grid;
        place-items: center;
      }
      .rate-box {
        display: grid;
        grid-template-columns: 1.15fr 0.85fr;
        gap: 14px;
      }
      .currency-panel {
        padding: 20px;
      }
      .currency-input {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        align-items: center;
        background: var(--soft);
        border-radius: 14px;
        padding: 14px;
        margin-bottom: 11px;
      }
      .currency-input input {
        border: 0;
        outline: 0;
        background: transparent;
        font-size: 24px;
        font-weight: 800;
        width: 100%;
      }
      .currency-input select {
        border: 0;
        background: transparent;
        font-weight: 800;
      }
      .rate-value {
        font-size: 30px;
        font-weight: 800;
      }
      .sim-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 13px;
      }
      .sim-card {
        padding: 17px;
      }
      .sim-card.active {
        border: 2px solid var(--primary);
      }
      .signal {
        display: flex;
        gap: 3px;
        align-items: end;
        height: 18px;
        margin-bottom: 12px;
      }
      .signal span {
        width: 4px;
        background: var(--primary);
        border-radius: 3px;
      }
      .signal span:nth-child(1) {
        height: 6px;
      }
      .signal span:nth-child(2) {
        height: 9px;
      }
      .signal span:nth-child(3) {
        height: 13px;
      }
      .signal span:nth-child(4) {
        height: 17px;
      }
      .store-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
      }
      .product {
        padding: 16px;
      }
      .product-image {
        height: 140px;
        border-radius: 14px;
        background: linear-gradient(135deg, #dff7f2, #8bd9ce);
        display: grid;
        place-items: center;
        color: var(--primary);
        margin-bottom: 14px;
      }
      .counter {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .counter button {
        width: 31px;
        height: 31px;
        border-radius: 9px;
        border: 1px solid var(--line);
        background: white;
        font-weight: 800;
      }
      .emergency-hero {
        background: linear-gradient(135deg, #7f1d1d, #dc2626);
        color: white;
        padding: 25px;
        border-radius: 22px;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 20px;
        align-items: center;
        margin-bottom: 18px;
      }
      .sos {
        width: 110px;
        height: 110px;
        border-radius: 50%;
        border: 8px solid rgba(255, 255, 255, 0.25);
        background: white;
        color: var(--danger);
        font-size: 24px;
        font-weight: 900;
      }
      .emergency-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 13px;
      }
      .emergency-card {
        padding: 17px;
      }
      .status-wrap {
        max-width: 760px;
        margin: 34px auto;
        text-align: center;
      }
      .status-icon {
        width: 82px;
        height: 82px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        margin: 0 auto 20px;
      }
      .success-icon {
        background: var(--success-soft);
        color: var(--success);
      }
      .booking-list {
        display: grid;
        gap: 14px;
      }
      .booking-card {
        padding: 18px;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 18px;
        align-items: center;
      }
      .booking-title {

    <div class="card panel"><h3>Select a permit</h3><div class="choice-grid">

    <div class="card panel"><h3>Required documents</h3>${["Passport copy", "Valid driving licence", "Visa or travel proof", "Recent photograph", "Address proof"].map((d, i) => `<div class="document-row"><div class="document-main"><div class="doc-icon">${icon(i < 3 ? "file-check-2" : "file-up")}</div><div><strong>${d}</strong><div class="small muted">${i < 3 ? "Uploaded" : "Required"}</div></div></div><button class="btn ${i < 3 ? "btn-outline" : "btn-secondary"}">${i < 3 ? "View" : "Upload"}</button></div>`).join("")}</div>
    <button class="btn btn-primary btn-full" onclick="navigate('review')">Review permit application ${icon("arrow-right", 17)}</button>
  </div></section>`);
      }
      function renderEssentials() {
        updateNav("services");
        state.currentService = "essentials";
        state.currentTotal = 0;
        const products = [
          ["plug-zap", "Universal travel adapter", 1499],
          ["luggage", "Digital luggage scale", 799],
          ["shield-check", "RFID passport wallet", 999],
          ["pill-bottle", "Travel medicine organiser", 499],
          ["neck-pillow", "Memory-foam neck pillow", 1299],
          ["package-check", "Packing cube set", 1199],
        ];
        setView(`<section class="page"><div class="container">
    ${crumbs([{ label: "Services", action: "navigate('services')" }, { label: "Travel Essentials" }])}
    <div class="page-title"><div><h2>Travel essentials store</h2><p>Useful travel products delivered before departure.</p></div><button class="btn btn-primary" onclick="openCart()">${icon("shopping-cart", 17)} Cart <span id="cartCount">${state.cart.length}</span></button></div>
    <div class="store-grid">${products.map((p) => `<div class="card product"><div class="product-image">${icon(p[0], 44)}</div><h3>${p[1]}</h3><div class="small muted">Travel-ready quality · TreCare verified</div><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:14px"><strong style="font-size:20px">${fmt(p[2])}</strong><button class="btn btn-secondary" onclick="addToCart('${p[1]}',${p[2]})">${icon("plus", 15)} Add</button></div></div>`).join("")}</div>
  </div></section>`);
      }
      function addToCart(name, price) {
        state.cart.push({ name, price });
        state.currentTotal = state.cart.reduce((a, b) => a + b.price, 0);
        document.getElementById("cartCount").textContent = state.cart.length;
        toast(name + " added");
      }
      function openCart() {
        openModal(
          "Your travel essentials",
          state.cart.length
            ? `${state.cart.map((x, i) => `<div class="product-row"><div><strong>${x.name}</strong><div class="small muted">Quantity 1</div></div><strong>${fmt(x.price)}</strong></div>`).join("")}<div class="line-item total"><span>Total</span><strong>${fmt(state.currentTotal)}</strong></div><button class="btn btn-primary btn-full" style="margin-top:12px" onclick="closeModal();navigate('review')">Proceed to checkout</button>`
            : `<p class="small muted">Your cart is currently empty.</p>`,
        );
      }
      function renderEmergency() {
        updateNav("support");
        state.currentService = "emergency";
        setView(`<section class="page"><div class="container">
    ${crumbs([{ label: "Home", action: "navigate('home')" }, { label: "Emergency Support" }])}
    <div class="emergency-hero"><div><span class="pill" style="background:rgba(255,255,255,.17);color:white">24×7 emergency centre</span><h1 style="font-size:40px;letter-spacing:-1.8px;margin:14px 0 10px">Immediate travel support when it matters.</h1><p style="margin:0;line-height:1.65;color:rgba(255,255,255,.82)">Use SOS for urgent medical, safety, detention, theft, assault, or lost-document situations. Your saved trip and profile details will be shared with the response team.</p></div><button class="sos" onclick="activateSOS()">SOS</button></div>
    <div class="emergency-grid">
      ${emergencyCard("ambulance", "Medical emergency", "Connect to local emergency services and TreCare medical support", "activateSOS()")}
      ${emergencyCard("book-x", "Lost passport", "Get embassy guidance, police-report steps, and document support", "openEmergencyCase('Lost passport')")}
      ${emergencyCard("shield-alert", "Theft or safety incident", "Start an urgent safety case and receive local guidance", "openEmergencyCase('Safety incident')")}
      ${emergencyCard("landmark", "Embassy assistance", "Find embassy or consulate details and required documents", "openEmergencyCase('Embassy assistance')")}
      ${emergencyCard("scale", "Detention or legal issue", "Escalate to emergency support and legal-assistance partners", "openEmergencyCase('Legal assistance')")}
      ${emergencyCard("plane-off", "Stranded traveller", "Urgent help with disruption, accommodation, and onward travel", "openEmergencyCase('Stranded traveller')")}
    </div>
    <div class="card panel" style="margin-top:18px"><h3>Saved emergency profile</h3><div class="line-item"><span>Traveller</span><strong>Akshat Goyal</strong></div><div class="line-item"><span>Current trip</span><strong>Dubai · 03–08 Aug 2026</strong></div><div class="line-item"><span>Emergency contact</span><strong>+91 98765 11111</strong></div><div class="line-item"><span>Insurance policy</span><strong>TCI-998210</strong></div><button class="btn btn-outline" onclick="toast('Emergency profile opened')">Update emergency profile</button></div>
  </div></section>`);
      }
      function emergencyCard(ic, title, desc, action) {
        return `<div class="card emergency-card"><div class="service-icon" style="background:var(--danger-soft);color:var(--danger)">${icon(ic)}</div><h3>${title}</h3><p class="small muted" style="line-height:1.6">${desc}</p><button class="btn btn-outline btn-full" onclick="${action}">Get help</button></div>`;
      }
      function activateSOS() {
        openModal(
          "Activate emergency SOS?",
          `<p class="small muted" style="line-height:1.65">This will create a high-priority emergency case and share your saved trip, identity, emergency contact, and current location when available.</p><button class="btn btn-danger btn-full" onclick="closeModal();toast('Emergency case activated — response team notified')">${icon("siren", 17)} Activate emergency case</button><button class="btn btn-outline btn-full" style="margin-top:9px" onclick="closeModal()">Cancel</button>`,
        );
      }
      function openEmergencyCase(type) {
        openModal(
          type,
          `<div class="form-grid"><div class="form-group"><label>Current country</label><input value="United Arab Emirates"></div><div class="form-group"><label>Can we call you?</label><select><option>Yes, immediately</option><option>Chat only</option></select></div><div class="form-group full"><label>Describe the situation</label><textarea rows="4" placeholder="Share what happened and where you are now"></textarea></div></div><button class="btn btn-danger btn-full" style="margin-top:14px" onclick="closeModal();toast('Urgent support case created')">Submit urgent case</button>`,
        );
      }
      function renderSupport() {
        renderAssistance();
      }
      function choice(title, desc, price, key, active = false) {
        return `<button class="choice-card ${active ? "active" : ""}" onclick="state.${key}='${title}';document.querySelectorAll('.choice-card').forEach(x=>x.classList.remove('active'));this.classList.add('active');toast('${title} selected')"><h4>${title}</h4><p>${desc}</p><strong>${price}</strong></button>`;
      }
      function serviceWorkflowPage(title, ic, body, buttonText, action) {
        setTimeout(() => (window.__serviceContinue = action), 0);
        return `<section class="page"><div class="container">${crumbs([{ label: "Services", action: "navigate('services')" }, { label: title }])}${steps(0)}<div class="content-grid"><div>${body}<button class="btn btn-primary btn-full" onclick="window.__serviceContinue()">${buttonText} ${icon("arrow-right", 17)}</button></div>${serviceSummary(title, "Selected service", state.currentTotal)}</div></div></section>`;
      }
      function serviceSummary(title, sub, total) {
        return `<aside class="card summary sticky"><div class="label">Your selection</div><h3 style="margin:7px 0">${title}</h3><div class="summary-box">${sub}</div><div class="line-item"><span>Service subtotal</span><strong>${fmt(total)}</strong></div><div class="line-item"><span>Taxes / partner fees</span><strong>Included</strong></div><div class="line-item total"><span>Estimated total</span><strong>${fmt(total)}</strong></div><div class="small muted" style="line-height:1.55;margin-top:10px">Final price is shown before payment and may vary when supplier revalidation is required.</div></aside>`;
      }
      function getServiceTitle() {
        return services.find((s) => s.id === state.currentService)?.title || "TreCare Service";
      }
      function renderReview() {
        updateNav("services");
        const title = getServiceTitle();
        setView(`<section class="page"><div class="container">
    ${steps(2)}
    <div class="content-grid"><div>
      <div class="card panel"><div style="display:flex;justify-content:space-between;gap:16px"><div><div class="label">Selected service</div><h3 style="margin:7px 0">${title}</h3></div><button class="btn btn-ghost" onclick="navigate('${state.currentService}')">Edit</button></div>
        ${reviewDetails()}
      </div>
      <div class="card panel"><h3>Traveller and contact details</h3><div class="line-item"><span>Primary traveller</span><strong>Akshat Goyal</strong></div><div class="line-item"><span>Email</span><strong>akshat@example.com</strong></div><div class="line-item"><span>Mobile</span><strong>+91 98765 43210</strong></div></div>
      <div class="card panel"><h3>Important terms</h3><label class="small muted"><input type="checkbox" checked> I agree to the service terms, supplier rules, cancellation policy, document declarations, and privacy terms.</label></div>
      <button class="btn btn-primary btn-full" onclick="navigate('payment')">Proceed to secure payment ${icon("lock-keyhole", 17)}</button>
    </div>${serviceSummary(title, "Ready for checkout", state.currentTotal)}</div>
  </div></section>`);
      }
      function reviewDetails() {
        const map = {
          visa: `<div class="line-item"><span>Destination</span><strong>${state.visaCountry}</strong></div><div class="line-item"><span>Visa assistance</span><strong>${state.visaPlan}</strong></div><div class="line-item"><span>Insurance</span><strong>${state.insurancePlan}</strong></div>`,
          passport: `<div class="line-item"><span>Document service</span><strong>${state.passportService}</strong></div><div class="line-item"><span>Applicant</span><strong>Akshat Goyal</strong></div>`,
          transfer: `<div class="line-item"><span>Vehicle</span><strong>${state.transferVehicle}</strong></div><div class="line-item"><span>Route</span><strong>DXB → Dubai Marina</strong></div><div class="line-item"><span>Pickup</span><strong>03 Aug · 11:30 PM</strong></div>`,
          forex: `<div class="line-item"><span>Currency</span><strong>INR → AED</strong></div><div class="line-item"><span>Delivery</span><strong>Home delivery</strong></div>`,
          sim: `<div class="line-item"><span>Plan</span><strong>${state.simPlan}</strong></div><div class="line-item"><span>Destination</span><strong>United Arab Emirates</strong></div>`,
          lounge: `<div class="line-item"><span>Lounge</span><strong>${state.lounge}</strong></div><div class="line-item"><span>Travellers</span><strong>2 adults</strong></div>`,

          permit: `<div class="line-item"><span>Permit</span><strong>${state.permit}</strong></div><div class="line-item"><span>Destination</span><strong>United Arab Emirates</strong></div>`,
          essentials: `<div class="line-item"><span>Products</span><strong>${state.cart.length} item(s)</strong></div><div class="line-item"><span>Delivery</span><strong>Before departure</strong></div>`,
        };
        return (
          map[state.currentService] ||
          `<div class="line-item"><span>Service</span><strong>${getServiceTitle()}</strong></div>`
        );
      }
      function renderPayment() {
        updateNav("services");
        setView(`<section class="page"><div class="container">
    ${steps(3)}
    <div class="content-grid"><div>
      <div class="card panel"><h3>Choose payment method</h3><div class="payment-tabs"><button class="payment-tab active" onclick="selectPayment(this,'Card')">Card</button><button class="payment-tab" onclick="selectPayment(this,'UPI')">UPI</button><button class="payment-tab" onclick="selectPayment(this,'Net banking')">Net banking</button><button class="payment-tab" onclick="selectPayment(this,'Wallet')">Wallet</button></div><div id="paymentForm"><div class="form-grid"><div class="form-group full"><label>Card number</label><input value="4242 4242 4242 4242"></div><div class="form-group"><label>Expiry</label><input value="12/29"></div><div class="form-group"><label>CVV</label><input value="123"></div><div class="form-group full"><label>Name on card</label><input value="AKSHAT GOYAL"></div></div></div></div>
      <div class="secure">${icon("shield-check", 21)}<div><strong>Secure checkout</strong>Payment details are encrypted. This prototype does not process or store actual payment credentials.</div></div>
      <button class="btn btn-primary btn-full" style="margin-top:15px" onclick="completePayment()">Pay ${fmt(state.currentTotal)}</button>
    </div>${serviceSummary(getServiceTitle(), "Final payable amount", state.currentTotal)}</div>
  </div></section>`);
      }
      function selectPayment(el, name) {
        document.querySelectorAll(".payment-tab").forEach((x) => x.classList.remove("active"));
        el.classList.add("active");

        document.getElementById("paymentForm").innerHTML =
          name === "Card"
            ? `<div class="form-grid"><div class="form-group full"><label>Card number</label><input value="4242 4242 4242 4242"></div><div class="form-group"><label>Expiry</label><input value="12/29"></div><div class="form-group"><label>CVV</label><input value="123"></div><div class="form-group full"><label>Name on card</label><input value="AKSHAT GOYAL"></div></div>`
            : `<div class="form-group"><label>${name} details</label><input placeholder="Enter ${name.toLowerCase()} details"></div>`;
      }
      function completePayment() {
        toast("Payment authorised");
        setTimeout(() => navigate("confirmation"), 650);
      }
      function renderConfirmation() {
        updateNav("applications");
        setView(
          `<section class="page"><div class="container">${steps(4)}<div class="status-wrap"><div class="status-icon success-icon">${icon("check", 38)}</div><span class="pill pill-success">Service confirmed</span><h1 style="font-size:46px;margin:17px 0">${getServiceTitle()} is confirmed.</h1><p class="muted" style="line-height:1.7">Confirmation, payment receipt, and next steps have been sent to akshat@example.com.</p><div class="card panel" style="text-align:left;margin-top:25px"><div class="label">Reference ID</div><h2 style="font-size:26px;margin:7px 0 17px">${state.orderId}</h2><div class="line-item"><span>Service</span><strong>${getServiceTitle()}</strong></div><div class="line-item"><span>Customer</span><strong>Akshat Goyal</strong></div><div class="line-item"><span>Payment</span><strong>Paid · ${fmt(state.currentTotal)}</strong></div><div class="line-item"><span>Status</span><strong>Confirmed / processing</strong></div></div><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn btn-secondary" onclick="toast('Receipt downloaded')">${icon("download", 17)} Download receipt</button><button class="btn btn-primary" onclick="navigate('application-details')">View service details</button><button class="btn btn-outline" onclick="navigate('services')">Explore more services</button></div></div></div></section>`,
        );
      }
      function renderApplicationDetails() {
        updateNav("applications");
        setView(`<section class="page"><div class="container">
    ${crumbs([{ label: "My applications", action: "navigate('applications')" }, { label: "Service details" }])}
    <div class="page-title"><div><span class="pill pill-blue">In progress</span><h2 style="margin:9px 0 0">${getServiceTitle()}</h2><p>${state.orderId} · Created on 31 July 2026</p></div><button class="btn btn-secondary" onclick="toast('Receipt downloaded')">${icon("download", 17)} Download receipt</button></div>
    <div class="content-grid"><div>
      <div class="card panel"><h3>Application progress</h3><div class="timeline"><div class="timeline-item"><strong>Order created</strong><p>Payment completed and service request created.</p></div><div class="timeline-item"><strong>Details under review</strong><p>TreCare specialist is validating submitted information.</p></div><div class="timeline-item"><strong>Partner processing</strong><p>Service partner will process the request after verification.</p></div><div class="timeline-item"><strong>Completion</strong><p>Documents, voucher, or final confirmation will appear here.</p></div></div></div>
      <div class="card panel"><h3>Manage this service</h3><div class="action-grid"><button class="action-card" onclick="toast('Upload section opened')">${icon("file-up")}<strong>Upload documents</strong><span>Add missing or updated files</span></button><button class="action-card" onclick="toast('Support chat opened')">${icon("message-circle")}<strong>Contact support</strong><span>Ask about this service</span></button><button class="action-card" onclick="openCancelRequest()">${icon("calendar-x")}<strong>Cancel request</strong><span>Review eligibility and charges</span></button></div></div>
    </div><aside class="card summary sticky"><div class="label">Application summary</div><h3 style="margin:7px 0">${getServiceTitle()}</h3><div class="line-item"><span>Reference</span><strong>${state.orderId}</strong></div><div class="line-item"><span>Customer</span><strong>Akshat Goyal</strong></div><div class="line-item"><span>Payment</span><strong>Paid</strong></div><div class="line-item total"><span>Total</span><strong>${fmt(state.currentTotal)}</strong></div></aside></div>
  </div></section>`);
      }
      function openCancelRequest() {
        openModal(
          "Cancel service request",
          `<p class="small muted" style="line-height:1.65">Cancellation eligibility depends on the service stage and supplier policy.</p><div class="summary-box"><div class="line-item"><span>Amount paid</span><strong>${fmt(state.currentTotal)}</strong></div><div class="line-item"><span>Estimated cancellation fee</span><strong>₹300</strong></div><div class="line-item total"><span>Estimated refund</span><strong>${fmt(Math.max(0, state.currentTotal - 300))}</strong></div></div><div class="form-group"><label>Cancellation reason</label><select><option>Change of plan</option><option>Booked by mistake</option><option>Duplicate order</option><option>Other</option></select></div><button class="btn btn-danger btn-full" style="margin-top:14px" onclick="closeModal();toast('Cancellation request submitted')">Submit cancellation request</button>`,
        );
      }
      function openModal(title, body) {
        document.getElementById("modalTitle").textContent = title;
        document.getElementById("modalBody").innerHTML = body;
        document.getElementById("modal").classList.add("show");
        initIcons();
      }
      function closeModal(e) {
        if (e && e.target.id !== "modal") return;
        document.getElementById("modal").classList.remove("show");
      }
      function toast(msg) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 2100);
      }
      renderHome();
    </script>
  </body>
</html>
